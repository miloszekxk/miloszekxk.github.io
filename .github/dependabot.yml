version: 2
updates:
  # Biblioteki strony (Astro, Tailwind, fonty)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]

  # Akcje używane w .github/workflows/deploy.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
